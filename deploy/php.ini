; Small and explicit. The rest comes from php.ini-production.
memory_limit = 128M
expose_php = Off
opcache.enable = 1
; The image never changes while it runs, so PHP files are never re-checked.
opcache.validate_timestamps = 0
opcache.memory_consumption = 64
opcache.max_accelerated_files = 10000
opcache.jit = off
